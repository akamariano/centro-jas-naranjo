services:
  db:
    image: postgres:16-alpine
    container_name: cjn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-cjn_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cjn_password}
      POSTGRES_DB: ${DB_NAME:-centro_jas_naranjo}
    ports:
      - "5432:5432"
    volumes:
      - cjn_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cjn_admin} -d ${DB_NAME:-centro_jas_naranjo}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cjn_pgdata:
