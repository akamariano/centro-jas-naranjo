name: Deploy test build to GitHub Pages

# Publica el frontend en modo de prueba (VITE_APP_MODE=local, sin backend/base de
# datos: todo se guarda en localStorage del navegador de quien lo visita).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Compilar (modo de prueba, ruta base de GitHub Pages)
        working-directory: frontend
        env:
          VITE_APP_MODE: local
          BASE_PATH: /centro-jas-naranjo/
        run: npm run build

      - name: Fallback de enrutamiento SPA (GitHub Pages no reescribe rutas)
        run: cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
